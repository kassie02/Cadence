// ==============================================================================
// Cadence - Ambient Policing System for LSPDFR
// Complete Configuration File
// ==============================================================================

[General]
// Master plugin toggle. Set to false to disable Cadence entirely.
EnablePlugin = true

// Dedicated logs folder and file debugging toggles.
// Cadence writes clean session logs to: plugins/LSPDFR/Cadence/Logs/Cadence.log
EnableFileLogging = true

// Debug logging mode (true / false).
// Default is true during testing and calibration. Set to false for standard silent gameplay.
// When true, telemetry (spawns, road nodes, UB queries, state transitions, blips, despawns)
// is recorded to plugins/LSPDFR/Cadence/Logs/Cadence.log and RagePluginHook.log.
Debug = true

[Keybinds]
// Primary key to open the Cadence in-game dashboard menu (Default: PageDown).
// Supported values: PageDown, F1-F12, Back, Tab, Enter, etc.
// Set to 0, None, Disabled, or false to completely disable the menu keybind.
MenuKey = PageDown

// Modifier key required in combination with MenuKey (Default: Q).
// Set to None to require no modifier key. Supported values: Q, Control, Shift, Alt, etc.
MenuModifierKey = Q

[Features]
// Feature 1: Ambient cruising police patrols across San Andreas roadways.
EnablePatrol = true

// Feature 2: Curated 1803 roadside traffic stops (routine citations, pat-downs, K9 searches).
EnableTrafficStops = true

// Feature 3: Parked stationary units & radar speed traps in highway medians and turnouts.
EnableStationary = true

// Feature 4A: Autonomous Code 2 and Code 3 background emergency runs.
EnableEmergencyRuns = true

// Feature 4B: Discreet takeover of rejected/declined LSPDFR callouts.
EnableRejectedCallouts = true

// Feature 5: Ambient units drafted to assist in active player pursuits.
EnablePursuitDrafting = true

// Feature 6: Officers responding to nearby gunfire and defending officers.
EnableThreatDefense = true

[Limits]
// Maximum number of ambient cruising patrol units active simultaneously (1 - 16).
MaxPatrolUnits = 4

// Maximum number of active roadside traffic stops (0 - 8).
MaxTrafficStops = 2

// Maximum number of stationary radar / watch units (0 - 8).
MaxStationaryUnits = 2

// Maximum number of Cadence units that can assist in an active pursuit (1 - 12).
MaxPursuitUnits = 4

// Distance in meters beyond which inactive ambient units are safely despawned (150 - 1500).
DespawnDistance = 450.0

// Minimum distance in meters from player for new ambient spawns (prevents pop-in, 30 - 300).
SpawnDistanceMin = 80.0

// Maximum distance in meters from player for new ambient spawns (100 - 600).
SpawnDistanceMax = 250.0

[Radar]
// Display color-coded radar minimap blips for Cadence units (true/false).
ShowRadarBlips = true

// Blip icon scale on the minimap (Default: 0.45, range 0.2 - 1.5).
BlipScale = 0.45

// Restrict radar blips to short range (hidden when far away unless responding/pursuing).
ShortRangeBlips = true

[Integration]
// Safely use Ultimate Backup for spawning ambient cops if installed (true/false).
UseUltimateBackup = true

// Apply authentic EUP uniforms to ambient officers (true/false).
EnableEupOutfits = true

// Mute police siren audio during roadside pullover traffic stops (flashing lights only).
MuteTrafficStopSiren = true
