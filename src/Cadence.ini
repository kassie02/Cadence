// ==============================================================================
// Cadence - Ambient Policing System for LSPDFR
// Complete Configuration File
// ==============================================================================

[General]
// Master plugin activation toggle (true = Activated, false = Deactivated).
// Set to false to completely turn off and deactivate Cadence whenever you want.
EnablePlugin = true
PluginActive = true

// Dedicated logs folder and file debugging toggles.
// Cadence writes clean session logs to: plugins/LSPDFR/Cadence/Logs/Cadence.log
EnableFileLogging = true

// Debug logging mode (true / false).
// Default is true during testing and calibration. Set to false for standard silent gameplay.
// When true, telemetry (spawns, road nodes, UB queries, state transitions, blips, despawns)
// is recorded to plugins/LSPDFR/Cadence/Logs/Cadence.log and RagePluginHook.log.
Debug = true

// World density and gameplay preset mode (Chaos / Realistic / Metro / Highway / Rural / Warzone).
// Chaos:     Living City / LA Metropolis high-density police activity (8 patrol, 4 stops, 4 standby, 4 runs, 6 pursuit, fast pacing).
// Realistic: Balanced authentic day-to-day policing (4 patrol, 2 stops, 2 standby, 2 runs, 4 pursuit).
// Metro:     Heavy downtown urban street presence with frequent traffic citations (6 patrol, 3 stops, 2 standby, 3 runs, 5 pursuit).
// Highway:   High-speed freeway interdiction & speed traps (5 patrol, 3 stops, 5 radar traps, 2 runs, 6 pursuit, 80% SAHP).
// Rural:     Sparse wide-territory county sheriff patrols for Blaine County (2 patrol, 1 stop, 1 standby, 1 run, 3 pursuit).
// Warzone:   Extreme high-intensity tactical city lockdown (12 patrol, 6 stops, 4 standby, 6 runs, 8 pursuit).
Preset = Chaos
ChaosMode = true

[Keybinds]
// Primary key to open the Cadence in-game dashboard menu (Default: PageDown).
// Supported values: PageDown, F1-F12, Back, Tab, Enter, etc.
// Set to 0, None, Disabled, or false to completely disable the menu keybind.
MenuKey = PageDown

// Modifier key required in combination with MenuKey (Default: Q).
// Set to None to require no modifier key. Supported values: Q, Control, Shift, Alt, etc.
MenuModifierKey = Q

// Panic Button keybinds (Default: LControlKey + Z).
// Triggers maximum priority emergency backup, plays PANIC_BUTTON.wav & scanner audio,
// commandeers nearest ambient units, and mobilizes tactical support.
// Set to 0, None, Disabled, or false to disable.
PanicButtonKey = Z
PanicButtonModifierKey = LControlKey

// Group Backup keybinds (Default: LControlKey + C).
// Requests coordinated multi-unit reinforcement to the officer's location.
GroupBackupKey = C
GroupBackupModifierKey = LControlKey

// Lean Backup Menu keybind (Default: X + PageDown).
// Opens clean RAGENativeUI backup selection menu (Local, State, EMS, Fire, Group, Panic, Dismiss).
BackupMenuKey = PageDown
BackupMenuModifierKey = X

// Dismiss backup key (Default: Enter).
// Dismisses active backup units, releases blips, and commands officers to return to patrol.
DismissBackupKey = Enter

[Features]
// Feature 1: Ambient cruising police patrols across San Andreas roadways.
EnablePatrol = true

// Feature 2: Curated 1803 roadside traffic stops (routine citations, pat-downs, K9 searches).
EnableTrafficStops = true

// Feature 3: Parked stationary units & radar speed traps in highway medians and turnouts.
EnableStationary = true

// Feature 4A: Autonomous Code 2 and Code 3 background emergency runs.
EnableEmergencyRuns = true

// Feature 4B: Discreet takeover of rejected/declined LSPDFR callouts.
EnableRejectedCallouts = true

// Feature 5: Ambient units drafted to assist in active player pursuits.
EnablePursuitDrafting = true

// Feature 6: Officers responding to nearby gunfire and defending officers.
EnableThreatDefense = true

[Limits]
// Maximum number of ambient cruising patrol units active simultaneously (1 - 16).
MaxPatrolUnits = 8

// Maximum number of active roadside traffic stops (0 - 8).
MaxTrafficStops = 4

// Maximum number of stationary radar / watch units (0 - 8).
MaxStationaryUnits = 4

// Maximum number of autonomous Code 2/3 emergency runs active simultaneously (0 - 8).
MaxEmergencyRuns = 4

// Maximum number of Cadence units that can assist in an active pursuit (1 - 12).
MaxPursuitUnits = 6

// Distance in meters beyond which inactive ambient units are safely despawned (150 - 1500).
DespawnDistance = 480.0

// Minimum distance in meters from player for new ambient spawns (prevents pop-in, 30 - 300).
SpawnDistanceMin = 70.0

// Maximum distance in meters from player for new ambient spawns (100 - 600).
SpawnDistanceMax = 220.0

[EmergencyServices]
// Enable diverse emergency services for background 911 runs (Police, Firefighters, and Ambulances/EMS).
EnableEmergencyVariety = true

// Allow police cruisers to respond to emergency runs.
AllowPoliceRuns = true

// Allow Los Santos Fire Department / County Fire engines (firetruk) to respond to emergencies.
AllowFireRuns = true

// Allow Paramedics and Ambulances (ambulance) to respond Code 3 to medical calls.
AllowAmbulanceRuns = true

[Jurisdiction]
// Ratio / balance between Highway Patrol (State Patrol) and Regular Police (City / County Sheriff) (0 - 100).
// 50 = Balanced (freeways have high State Patrol; city/county roads have local police/sheriff).
// 75 = Heavy State Patrol presence across all road networks.
// 25 = Heavy Local Police/Sheriff presence across all road networks.
// 0  = 100% Local Police / County Sheriff (No Highway Patrol).
// 100 = 100% Highway Patrol / State Patrol.
HighwayPatrolRatio = 50

[Radar]
// Display color-coded radar minimap blips for Cadence units (true/false).
ShowRadarBlips = true

// Blip icon scale on the minimap (Default: 0.45, range 0.2 - 1.5).
BlipScale = 0.45

// Restrict radar blips to short range (false = keep visible on radar ring so cops don't vanish from map).
ShortRangeBlips = false

[Integration]
// Safely use Ultimate Backup for spawning ambient cops if installed (true/false).
UseUltimateBackup = true

// Strict fallback guard: when false, Cadence strictly uses Ultimate Backup and will NEVER fall back
// to vanilla GTA default police vehicles (police, sheriff, etc.). If UB fails to spawn a unit, the spawn is aborted cleanly.
// Set to false by default to ensure only your customized Ultimate Backup fleets ever spawn.
Fallback = false
AllowFallback = false

// Apply authentic EUP uniforms to ambient officers (true/false).
EnableEupOutfits = true

// Mute police siren audio during roadside pullover traffic stops (flashing lights only).
MuteTrafficStopSiren = true

[Backup]
// Master toggle for the Ambient Backup system (Panic Button, Group Backup, Backup Menu).
// (Keybinds for Panic Button, Group Backup, Backup Menu, and Dismiss are configured in [Keybinds] above).
EnableBackup = true

// Number of units dispatched for Panic Button (Default: 4-7 randomized ratio, range 1 - 12).
// Supports a randomized range (e.g. 4-7) or a fixed number (e.g. 5).
PanicButtonUnits = 4-7

// Number of units dispatched for Group Backup (Default: 2-3 randomized ratio, range 1 - 12).
// Supports a randomized range (e.g. 2-3) or a fixed number (e.g. 3).
GroupBackupUnits = 2-3

// Group Backup emergency driving code (true = Code 3 with audible sirens, false = Code 2 silent lightbars).
GroupBackupCode3 = true

// Ambient-first commandeering: scan world within 320m for idle cruisers/stationary units
// and redirect them to player before spawning new vehicles (true/false).
AllowAmbientCommandeer = true

// If ambient units are not available, allow fallback spawner to fulfill the requested backup quota (true/false).
AllowFallbackSpawning = true
